name: Notify Google Indexing API

on:
  push:
    branches:
      - master
    paths:
      - "_publications/**"
      - "_preprints/**"
      - "_talks/**"
      - "_books/**"
      - "_theses/**"
      - "_teaching/**"
      - "_miscellaneous/**"
      - "_pages/**"

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Resolve diff range
        id: diff
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "base_sha=$(git hash-object -t tree /dev/null)" >> "$GITHUB_OUTPUT"
          else
            echo "base_sha=$BEFORE_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Notify Google Indexing API
        env:
          GCP_INDEXING_SA_KEY: ${{ secrets.GCP_INDEXING_SA_KEY }}
          BASE_SHA: ${{ steps.diff.outputs.base_sha }}
          HEAD_SHA: ${{ steps.diff.outputs.head_sha }}
        run: |
          python scripts/notify_google_indexing.py "$BASE_SHA" "$HEAD_SHA"
