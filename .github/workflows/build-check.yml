# PR ごとに Jekyll のビルドが通るかを確認する。
# 公開は従来どおり GitHub Pages（github-pages gem）が行うため、ここではビルドだけを実行し、デプロイはしない。
name: Build check

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # GitHub Pages のビルド環境に合わせて Ruby 3.3 を使う
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --trace
        env:
          JEKYLL_ENV: production
